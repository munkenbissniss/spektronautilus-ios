name: iOS build
on: [push, pull_request]
jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 web/get-ffmpeg.py || true
      - run: python3 scripts/sync_web.py
      - run: python3 tests/test_bridge.py
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: python3 web/get-ffmpeg.py || true
      - run: python3 scripts/sync_web.py
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project Spektronautilus.xcodeproj -scheme Spektronautilus -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
