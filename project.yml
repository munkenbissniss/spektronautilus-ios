# Xcode project description for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# The .xcodeproj file is generated from this, so it is never committed:   brew install xcodegen && python3 scripts/sync_web.py && xcodegen generate
name: Spektronautilus
options:
  bundleIdPrefix: no.spektronautilus
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Spektronautilus:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: App/www
        type: folder
        buildPhase: resources
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Spektronautilus
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Spektronautilus listens to the sound around you, or to a sound input you choose, so the visuals can follow the beat. Nothing is recorded or sent anywhere unless you start a recording yourself."
        NSPhotoLibraryAddUsageDescription: "Spektronautilus can save the videos you make to your photo library."
        NSLocalNetworkUsageDescription: "Used to find screens and sound devices on your network."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.spektronautilus.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
schemes:
  Spektronautilus:
    build:
      targets:
        Spektronautilus: all
    run:
      config: Debug
    archive:
      config: Release
